<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Notes App</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            min-height:100vh;
            background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
            overflow-x:hidden;
            position:relative;
            padding:40px 20px;
        }

        body::before{
            content:'';
            position:absolute;
            width:500px;
            height:500px;
            background:#7c3aed;
            border-radius:50%;
            top:-200px;
            left:-150px;
            filter:blur(120px);
            opacity:0.4;
            animation:move1 8s infinite alternate;
        }

        body::after{
            content:'';
            position:absolute;
            width:450px;
            height:450px;
            background:#06b6d4;
            border-radius:50%;
            bottom:-200px;
            right:-100px;
            filter:blur(120px);
            opacity:0.4;
            animation:move2 10s infinite alternate;
        }

        @keyframes move1{
            from{
                transform:translateY(0);
            }
            to{
                transform:translateY(80px);
            }
        }

        @keyframes move2{
            from{
                transform:translateX(0);
            }
            to{
                transform:translateX(-80px);
            }
        }

        .container{
            width:90%;
            max-width:1200px;
            margin:auto;
            position:relative;
            z-index:10;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:40px;
            flex-wrap:wrap;
            gap:20px;
        }

        .logo{
            color:white;
            font-size:42px;
            font-weight:700;
            letter-spacing:1px;
        }

        .logo span{
            color:#38bdf8;
        }

        .tagline{
            color:#cbd5e1;
            font-size:16px;
            margin-top:5px;
        }

        .glass-form{
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,0.15);
            padding:35px;
            border-radius:30px;
            box-shadow:0 20px 50px rgba(0,0,0,0.35);
            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(40px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .glass-form h2{
            color:white;
            margin-bottom:25px;
            font-size:30px;
        }

        .input-group{
            margin-bottom:20px;
        }

        input, textarea{
            width:100%;
            padding:18px;
            border:none;
            border-radius:18px;
            outline:none;
            background:rgba(255,255,255,0.12);
            color:white;
            font-size:16px;
            transition:0.4s;
            border:1px solid transparent;
        }

        input::placeholder,
        textarea::placeholder{
            color:#cbd5e1;
        }

        input:focus,
        textarea:focus{
            border-color:#38bdf8;
            box-shadow:0 0 20px rgba(56,189,248,0.5);
            transform:translateY(-2px);
        }

        textarea{
            resize:none;
            height:160px;
        }

        .btn{
            width:100%;
            padding:18px;
            border:none;
            border-radius:18px;
            background:linear-gradient(135deg,#06b6d4,#7c3aed);
            color:white;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            transition:0.4s;
            position:relative;
            overflow:hidden;
        }

        .btn:hover{
            transform:translateY(-5px);
            box-shadow:0 20px 40px rgba(0,0,0,0.4);
        }

        .notes{
            margin-top:50px;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
            gap:30px;
        }

        .card{
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,0.15);
            border-radius:28px;
            padding:28px;
            color:white;
            position:relative;
            overflow:hidden;
            transition:0.5s;
            animation:cardShow 1s ease;
        }

        @keyframes cardShow{
            from{
                opacity:0;
                transform:translateY(50px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .card::before{
            content:'';
            position:absolute;
            width:180px;
            height:180px;
            background:rgba(255,255,255,0.08);
            border-radius:50%;
            top:-60px;
            right:-60px;
        }

        .card:hover{
            transform:translateY(-10px) scale(1.02);
            box-shadow:0 25px 50px rgba(0,0,0,0.4);
        }

        .card h3{
            font-size:26px;
            margin-bottom:15px;
            color:#f8fafc;
        }

        .card p{
            color:#cbd5e1;
            line-height:1.8;
            margin-bottom:25px;
        }

        .delete-btn{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:12px 18px;
            background:linear-gradient(135deg,#ef4444,#dc2626);
            border-radius:14px;
            text-decoration:none;
            color:white;
            font-weight:500;
            transition:0.3s;
        }

        .delete-btn:hover{
            transform:scale(1.08);
            box-shadow:0 10px 20px rgba(239,68,68,0.4);
        }

        .floating{
            position:absolute;
            width:80px;
            height:80px;
            border-radius:50%;
            background:rgba(255,255,255,0.08);
            animation:float 6s infinite ease-in-out;
        }

        .f1{
            top:20%;
            left:5%;
        }

        .f2{
            bottom:10%;
            right:5%;
            animation-delay:2s;
        }

        .f3{
            top:70%;
            left:40%;
            animation-delay:4s;
        }

        @keyframes float{
            0%,100%{
                transform:translateY(0);
            }
            50%{
                transform:translateY(-30px);
            }
        }

        @media(max-width:768px){

            .logo{
                font-size:32px;
            }

            .glass-form{
                padding:25px;
            }

        }

    </style>

</head>

<body>

<div class="floating f1"></div>
<div class="floating f2"></div>
<div class="floating f3"></div>

<div class="container">

    <div class="top-bar">

        <div>
            <h1 class="logo">Note<span>Flow</span></h1>
            <p class="tagline">
                Organize your thoughts beautifully
            </p>
        </div>

    </div>

    <div class="glass-form">

        <h2>✨ Create New Note</h2>

        <form action="/add" method="POST">

            <div class="input-group">
                <input type="text"
                       name="title"
                       placeholder="Enter note title">
            </div>

            <div class="input-group">
                <textarea name="content"
                          placeholder="Write something amazing..."></textarea>
            </div>

            <button class="btn" type="submit">
                ➕ Add Note
            </button>

        </form>

    </div>

    <div class="notes">

        {% for note in notes %}

        <div class="card">

            <h3>📌 {{ note[1] }}</h3>

            <p>{{ note[2] }}</p>

            <a href="/delete/{{ note[0] }}"
               class="delete-btn">

               🗑 Delete

            </a>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
